services:
  app:
    build: .
    container_name: next-training-app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    working_dir: /app
    ports:
      - "9000:3000"
    command: sleep infinity
    depends_on:
      - db

  db:
    image: postgres:18
    container_name: sotugyou-seisaku-db
    environment:
      POSTGRES_DB: sotugyou_seisaku
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  node_modules:
  db_data: